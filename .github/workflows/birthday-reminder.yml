name: Birthday Reminder

# Ежедневная проверка дней рождения и рассылка напоминаний.
# Запуск по расписанию + ручной запуск через Actions.

on:
  schedule:
    # 06:00 UTC = 09:00 Москва (UTC+3) каждый день
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Call birthday-check endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BIRTHDAY_CHECK_URL }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Birthday check failed with HTTP $HTTP_CODE"
            exit 1
          fi
