name: Birthday Reminder

# Ежедневная проверка дней рождения и рассылка напоминаний.
# Запуск по расписанию + ручной запуск через Actions.

on:
  schedule:
    # 06:00 UTC = 09:00 Москва (UTC+3) каждый день
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Call birthday-check endpoint
        run: |
          # При ручном запуске добавляем ?manual=1 — бот пришлёт список ближайших ДР.
          # По крону — обычный режим (сегодня + через 2 дня).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ secrets.BIRTHDAY_CHECK_URL }}?manual=1"
          else
            URL="${{ secrets.BIRTHDAY_CHECK_URL }}"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Birthday check failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Парсим JSON и проверяем поле ok.
          OK=$(echo "$BODY" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            ERROR=$(echo "$BODY" | jq -r '.error // "unknown error"')
            echo "::error::Birthday check returned ok=false: $ERROR"
            exit 1
          fi

          # Диагностика: сколько участников найдено и сколько сообщений отправлено.
          MEMBERS=$(echo "$BODY" | jq -r '.members // 0')
          SENT=$(echo "$BODY" | jq -r '.sent // 0')
          SUBSCRIBERS=$(echo "$BODY" | jq -r '.subscribers // 0')
          echo "members=$MEMBERS subscribers=$SUBSCRIBERS sent=$SENT"

          if [ "$MEMBERS" -gt 0 ] && [ "$SENT" -eq 0 ]; then
            echo "::warning::Найдены именинники ($MEMBERS), но отправлено 0 сообщений. Возможно, нет активных подписчиков (subscribers=$SUBSCRIBERS) — подпишитесь через /start в боте."
          fi
